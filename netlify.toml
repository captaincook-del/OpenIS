[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Adresses publiées sur le site, injectées à la construction (préfixe VITE_ obligatoire).
  # Pour ne pas les inscrire dans le dépôt Git, supprimez ces deux lignes et définissez les mêmes
  # variables dans Netlify : Site configuration > Environment variables.
  VITE_CONTACT_EMAIL = "mon_si_libre@proton.me"
  VITE_CLAIMS_EMAIL = "mon_si_libre@proton.me"
  # Dépôt Git affiché par le logo GitHub (laisser vide pour masquer le logo)
  VITE_REPO_URL = "https://github.com/captaincook-del/OpenIS"

# Aperçus de déploiement : adresse de test pour ne pas publier la vraie
[context.deploy-preview.environment]
  VITE_CONTACT_EMAIL = "test@monde-libre.example"
  VITE_CLAIMS_EMAIL = "test@monde-libre.example"

# Le routeur est en mode hash (/#/budget) : aucune règle de réécriture n'est nécessaire.
# Si vous passez en mode historique, ajoutez :
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Les fichiers générés par Vite portent un nom unique : cache long possible
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"