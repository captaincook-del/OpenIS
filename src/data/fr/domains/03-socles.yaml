- name: Annuaire LDAP
  role: Comptes et groupes
  cost: { unit: user, price: 15, min: 1500, setup: [300, 4000, 25000], etp: [0.02, 0.1, 0.5], ref: "Active Directory : CAL Windows Server (≈ 40 $) et licences serveur", src: "https://www.trustedtechteam.com/collections/sale/2025" }
  v: [LLDAP, OpenLDAP, FreeIPA, 389 Directory Server multi-maître, 'FreeIPA multi-sites, HSM pour les clés']
  by_size:
    startup:
      essentielle: {text: 'LLDAP, attributs POSIX saisis à la main', why: 'Avec quelques comptes, ajouter à la main les identifiants et groupes POSIX reste raisonnable.'}
      standard: {text: 'LLDAP + sauvegarde de la base, attributs POSIX saisis à la main'}
    pme:
      essentielle: {text: FreeIPA, why: 'LLDAP n''a pas de gestion native de POSIX (identifiants, groupes, interpréteurs) : à plusieurs centaines de comptes, la saisie manuelle devient une source d''erreurs.'}
