id: shuffle
updated: 2026-10
summary: Automatisation de la réponse de sécurité (SOAR) par workflows visuels.
why:
- Construit des enchaînements d'actions par glisser-déposer, avec de nombreuses intégrations.
- Licence AGPL-3.0 et déploiement par conteneurs.
alternatives:
- name: Ansible
  id: ansible
  verdict: Pour appliquer des actions de remédiation sur des machines, sans interface de workflow.
- name: n8n
  url: https://n8n.io
  verdict: Automatisation généraliste, sous licence non libre au sens strict.
- name: Splunk SOAR
  url: https://www.splunk.com
  verdict: Très complet, mais propriétaire et coûteux.
limits:
- Plusieurs conteneurs à exploiter ; la qualité des applications tierces varie.
when_not: Pour quelques actions répétitives, des scripts Ansible suffisent.
